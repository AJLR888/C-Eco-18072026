<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadow -->
    <filter id="banner-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.38" />
    </filter>

    <style>
      .c-text {
        font-family: "Arial Black", "Montserrat", "Segoe UI Black", "Arial", sans-serif;
        font-weight: 900;
        font-size: 142px;
        fill: #71209C;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .eco-text {
        font-family: "Arial Black", "Montserrat", "Segoe UI Black", "Arial", sans-serif;
        font-weight: 900;
        font-size: 142px;
        fill: #E6E6E8;
        letter-spacing: 4px;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- Slanted Logo Container -->
  <g transform="skewX(-9.5)" filter="url(#banner-shadow)">
    <!-- Left Section: Light Grey Panel -->
    <rect x="90" y="60" width="220" height="200" fill="#E6E6E8" />

    <!-- Right Section: Purple Panel -->
    <rect x="310" y="60" width="430" height="200" fill="#71209C" />

    <!-- Left Letter: C -->
    <text x="200" y="165" class="c-text">C</text>

    <!-- Bridging Pill / Dash -->
    <rect x="282" y="142" width="56" height="36" rx="18" fill="#E6E6E8" stroke="#71209C" stroke-width="7" />

    <!-- Right Letters: ECO -->
    <text x="525" y="165" class="eco-text">ECO</text>
  </g>
</svg>
