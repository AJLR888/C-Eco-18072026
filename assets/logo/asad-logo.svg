<svg width="720" height="300" viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#150826" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Banner group with shadow -->
  <g filter="url(#softShadow)">
    <!-- Right (purple) panel -->
    <polygon points="230,40 700,40 660,260 190,260" fill="#57039e"/>
    <!-- Left (lilac) panel -->
    <polygon points="60,40 260,40 220,260 20,260" fill="#f3e9ff"/>
  </g>

  <!-- Dash connector -->
  <rect x="204" y="140" width="46" height="20" rx="10" fill="#41f096"/>

  <!-- "C" letter -->
  <text x="140" y="222" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="190" fill="#57039e" text-anchor="middle">C</text>

  <!-- "ECO" letters -->
  <text x="470" y="222" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="190" fill="#f7f2fa" text-anchor="middle">ECO</text>
</svg>
